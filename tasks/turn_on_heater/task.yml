type: Turn On Heater
desc: Heat a sample using the heater's Matterix digital twin.

devices:
  heater:
    type: heater

input_resources:
  sample:
    type: sample_vial

input_parameters:
  target_temperature:
    type: float
    unit: celsius
    value: 75.0
    min: 20.0
    max: 150.0
    desc: Target temperature for the heater

  headless:
    type: bool
    value: true
    desc: >
      Whether Isaac Sim boots with no visible window. True (default) for real automated
      runs; set false on submission to watch it on a display (e.g. over VNC) -- only
      takes effect on the first run_workflow() call in a given MatterixBackend actor's
      process, since Isaac Sim can't be reconfigured after boot.
